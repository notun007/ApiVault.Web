<app-page-header title="Reset password" eyebrow="Security administration" description="Set a new password for an ApiVault user. Access is restricted to Administrators and Super Administrators."></app-page-header>

<section class="panel reset-panel">
  <header class="panel-header">
    <div><h2>User credentials</h2><p>Select an account and assign a temporary password through an approved secure process.</p></div>
  </header>

  @if (loading()) {
    <div class="table-loading">Loading users…</div>
  } @else {
    <form class="modal-form" [formGroup]="form" (ngSubmit)="resetPassword()">
      <label class="field"><span>User *</span>
        <select class="select" formControlName="userId">
          <option value="">Select a user</option>
          @for (user of users(); track user.id) {
            <option [value]="user.id">{{ user.displayName }} ({{ user.username }}){{ user.isActive ? '' : ' — Inactive' }}</option>
          }
        </select>
      </label>
      <div class="form-grid two-column">
        <label class="field"><span>New password *</span><input class="input" type="password" formControlName="newPassword" autocomplete="new-password"><small>Use at least 12 characters.</small></label>
        <label class="field"><span>Confirm new password *</span><input class="input" type="password" formControlName="confirmPassword" autocomplete="new-password"></label>
      </div>
      <div class="inline-alert warning"><strong>Secure handling</strong><span>Distribute the new password only through an approved secure channel.</span></div>
      @if (errorMessage()) { <div class="inline-alert error">{{ errorMessage() }}</div> }
      <div class="modal-actions"><button class="button button-primary" type="submit" [disabled]="saving() || loading()">{{ saving() ? 'Resetting…' : 'Reset password' }}</button></div>
    </form>
  }
</section>
